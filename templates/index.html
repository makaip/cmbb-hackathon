<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/vis/4.21.0/vis.min.js"></script>
    <title>File Upload</title>
</head>
<body>
    <div class="wrapper">
        <div class="left-panel">
            <div class="info">
                <h1>BioSeq AI</h1>
                <p>Upload a CSV, TSV, or other supported formats.</p>
            </div>
            <form id="upload-form" enctype="multipart/form-data">
                <div class="input-group">
                    <div>
                        <label for="file">Upload File:</label>
                        <input type="file" name="file" id="file" required>
                    </div>
                    <div>
                        <label for="count">Filter Count:</label>
                        <input type="number" name="count" id="count" placeholder="Filter Count" min="-1" value="20">
                    </div>
                    <div>
                        <label for="max-workers">Max Threads:</label>
                        <input type="number" name="max-workers" id="max-workers" placeholder="Max Threads" min="1" max="100" value="100">
                    </div>
                    <div>
                        <label for="gene-limit">Gene Limit:</label>
                        <input type="number" name="gene-limit" id="gene-limit" placeholder="Gene Limit" min="-1" value="250">
                    </div>
                </div>
                <br>
                <input type="submit" value="Upload" style="width: 50%; text-align: center; display: block; margin: auto;">
                <br><br><br><br>
                <div id="loading" class="loader" hidden></div>
            </form>
        </div>
        <div class="right-panel">
            <div class="tab-bar">
                <button class="tab-button" onclick="openTab('blue')">Knowledge Graph</button>
                <button class="tab-button" onclick="openTab('table')">Data Overview</button>
                <button class="tab-button" onclick="openTab('red')">RNA Breakdown</button>
            </div>
            <div id="blue" class="tab-content" style="display: block; background-color: #f0f5ff; height: 100vh;">
                <div id="network"></div>
            </div>
            <div id="table" class="tab-content" style="display: none; overflow: auto; height: 100vh;">

                <h2>Top 20 Entries</h2>
                <table id="result-table">
                    <thead>
                        <tr>
                            <th>Gene ID</th>
                            <th>Count</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
                <br><br><br><br><br><br><br><br>
            </div>
            <div id="red" class="tab-content" style="display: none; background-color: #f7f1fe; height: 100%;"></div>
        </div>
    </div>
    <script>
        function openTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.style.display = 'none';
            });
            document.getElementById(tabName).style.display = 'block';
        }

        document.getElementById('upload-form').addEventListener('submit', function(event) {
            event.preventDefault();
            
            let formData = new FormData();
            formData.append('file', document.getElementById('file').files[0]);
            let filterCount = document.querySelector('input[name="count"]').value;
            formData.append('count', filterCount);

            // Show loader
            document.getElementById('loading').style.display = 'block';

            fetch('/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                // Hide loader
                document.getElementById('loading').style.display = 'none';

                if (data.error) {
                    alert(data.error);
                } else {
                    let tableBody = document.querySelector('#result-table tbody');
                    console.log(data);
                    tableBody.innerHTML = "";
                    data.top_rows.forEach(row => {
                        let tr = document.createElement('tr');
                        tr.innerHTML = `<td>${row.gene_id || 'N/A'}</td><td>${row.Normalized_Read_Counts || 0}</td>`;
                        tableBody.appendChild(tr);
                    });

                    // Clear existing nodes and edges
                    nodes.clear();
                    edges.clear();
                    
                    // Add new nodes and edges from the response
                    if (data.connections) {
                        data.connections.nodes.forEach(node => {
                            let new_container = document.createElement("div");

                            let title = document.createElement("h1");
                            title.innerText = node.label;

                            let p = document.createElement('p')
                            p.innerText = `Click the gene twice to go to this gene's NCBI page`

                            let link = `https://www.ncbi.nlm.nih.gov/gene/?term=${node.label}`

                            let description_container = document.createElement("p");
                            description_container.innerText = node.title

                            new_container.appendChild(title);
                            new_container.appendChild(description_container);
                            new_container.appendChild(p);
                            

                            nodes.add({id: node.id, label: node.label, title: new_container, link: link});
                            let node_ele = document.createElement('p');
                            node_ele.style.display = 'none';
                            node_ele.id = node.id;
                            node_ele.innerText = link
                        });
                        
                        data.connections.edges.forEach(edge => {
                            edges.add(edge);
                        });
                    }
                    
                    // Update options to show edge titles on hover
                    options.edges.hoverWidth = 2;
                    options.edges.selectionWidth = 2;
                    options.edges.font = {
                        size: 12,
                        color: '#000000',
                        strokeWidth: 0,
                        background: 'rgba(255, 255, 255, 0.7)'
                    };
                    options.edges.smooth = {
                        enabled: true,
                        type: 'continuous',
                        forceDirection: 'none'
                    };
                    
                    // Recreate the network with updated options
                    network.setOptions(options);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                // Hide loader even if an error occurs
                document.getElementById('loading').style.display = 'none';
            });
        });




        // Initialize vis.js graph with custom node shapes and styles
        var nodes = new vis.DataSet([]);
        var edges = new vis.DataSet([]);
        var container = document.getElementById('network');
        var data = { nodes: nodes, edges: edges };
        var options = {
            nodes: {
                shape: 'box',
                borderWidth: 2,
                margin: 12,
                borderRadius: 8,
                shadow: false,
                color: {
                    background: '#2563eb',
                    border: '#1d4ed8',
                    highlight: {
                    background: '#1d4ed8',
                    border: '#1e40af'
                    }
                },
                font: {
                    color: 'white',
                    size: 14,
                    face: 'Roboto, Arial'
                }
            },
            edges: {
                color: {
                    color: '#2563eb',
                    highlight: '#1d4ed8'  
                },
                length: 250,  // Increase this value to make connections longer
                smooth: {
                    enabled: true,
                    type: 'dynamic',
                    roundness: 0.5
                }
                },
                physics: {
                    enabled: true,
                    barnesHut: {
                        gravitationalConstant: -2000,
                        springLength: 200,  // Increase this for longer connections
                        springConstant: 0.04,  // Decrease this to make edges less rigid
                        "avoidOverlap": 0.2
                    },
                    stabilization: {
                        iterations: 1000
                    }
                }, 
                interaction: {
                    dragNodes:true,
                    dragView: true,
                    hideEdgesOnDrag: false,
                    hideNodesOnDrag: false,
                    hover: true,
                    hoverConnectedEdges: true,
                        key board: {
                        enabled: false,
                        speed: {x: 10, y: 10, zoom: 0.02},
                        bindToWindow: true,
                    },
                    multiselect: false,
                    navigationButtons: false,
                    selectable: true,
                    selectConnectedEdges: true,
                    tooltipDelay: 200,
                    zoomView: true
                }
        };

        var network = new vis.Network(container, data, options);

        // Track double-click logic
        let lastClickTime = 0;
        let lastClickedNode = null;
        const doubleClickThreshold = 300; // Time in milliseconds

        network.on("click", function (params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var currentTime = new Date().getTime();

                if (lastClickedNode === nodeId && (currentTime - lastClickTime) < doubleClickThreshold) {
                    // Double-click detected
                    var node = nodes.get(nodeId);
                    if (node.link) {
                        window.open(node.link, "_blank"); // Open link in new tab
                    } else {
                        alert("Double-clicked on node: " + node.label);
                    }
                    lastClickedNode = null; // Reset to prevent re-triggering
                } else {
                    // First click detected
                    lastClickedNode = nodeId;
                    lastClickTime = currentTime;
                }
            }
        });
    </script>
</body>
</html>
