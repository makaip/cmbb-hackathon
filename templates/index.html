<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/vis/4.21.0/vis.min.js"></script>
    <title>File Upload</title>
</head>
<body>
    <div class="wrapper">
        <div class="left-panel">
            <div class="info">
                <h1>RNA ISAS</h1>
                <p>Upload a CSV, TSV, or other supported formats.</p>
            </div>
            <form id="upload-form" enctype="multipart/form-data">
                <div class="input-group">
                    <div>
                        <label for="file">Upload File:</label>
                        <input type="file" name="file" id="file" required>
                    </div>
                    <div>
                        <label for="count">Filter Count:</label>
                        <input type="number" name="count" id="count" placeholder="Filter Count" min="-1" value="20">
                    </div>
                    <div>
                        <label for="max-workers">Max Threads:</label>
                        <input type="number" name="max-workers" id="max-workers" placeholder="Max Threads" min="1" max="100" value="100">
                    </div>
                    <div>
                        <label for="gene-limit">Gene Limit:</label>
                        <input type="number" name="gene-limit" id="gene-limit" placeholder="Gene Limit" min="-1" value="250">
                    </div>
                </div>
                <br>
                <input type="submit" value="Upload" style="width: 50%; text-align: center; display: block; margin: auto;">
                <br><br><br><br>
                <div id="loading" class="loader" hidden></div>
            </form>
        </div>
        <div class="right-panel">
            <div class="tab-bar">
                <button class="tab-button" onclick="openTab('blue')">Knowledge Graph</button>
                <button class="tab-button" onclick="openTab('table')">Data Overview</button>
                <button class="tab-button" onclick="openTab('red')">RNA Breakdown</button>
            </div>
            <div id="blue" class="tab-content" style="display: block; background-color: blue; height: 100vh;">
                <div id="network"></div>
            </div>
            <div id="table" class="tab-content" style="display: none; overflow: auto; height: 100vh;">

                <h2>Top 20 Entries</h2>
                <table id="result-table">
                    <thead>
                        <tr>
                            <th>Gene ID</th>
                            <th>Count</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
                <br><br><br><br><br><br><br><br>
            </div>
            <div id="red" class="tab-content" style="display: none; background-color: red; height: 100%;"></div>
        </div>
    </div>
    <script>
        function openTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.style.display = 'none';
            });
            document.getElementById(tabName).style.display = 'block';
        }

        document.getElementById('upload-form').addEventListener('submit', function(event) {
            event.preventDefault();
            
            let formData = new FormData();
            formData.append('file', document.getElementById('file').files[0]);
            let filterCount = document.querySelector('input[name="count"]').value;
            formData.append('count', filterCount);

            // Show loader
            document.getElementById('loading').style.display = 'block';

            fetch('/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                // Hide loader
                document.getElementById('loading').style.display = 'none';

                if (data.error) {
                    alert(data.error);
                } else {
                    let tableBody = document.querySelector('#result-table tbody');
                    tableBody.innerHTML = "";
                    data.top_data.forEach(row => {
                        let tr = document.createElement('tr');
                        tr.innerHTML = `<td>${row.gene_id || 'N/A'}</td><td>${row.Normalized_Read_Counts || 0}</td>`;
                        tableBody.appendChild(tr);
                    });
                }
            })
            .catch(error => {
                console.error('Error:', error);
                // Hide loader even if an error occurs
                document.getElementById('loading').style.display = 'none';
            });
        });




        // Initialize vis.js graph with custom node shapes and styles
        var nodes = new vis.DataSet([
            {id: 1, label: 'MTC01', shape: 'box', color: {background: '#45a049', border: '#2e7d32'}, font: {color: 'white'}},
            {id: 2, label: 'Mitochondria', shape: 'ellipse', color: {background: '#ff9800', border: '#f57c00'}, font: {color: 'white'}},
            {id: 3, label: 'ATP Production', shape: 'ellipse', color: {background: '#2196F3', border: '#1976D2'}, font: {color: 'white'}},
            {id: 4, label: 'Cell Respiration', shape: 'ellipse', color: {background: '#9C27B0', border: '#7B1FA2'}, font: {color: 'white'}},
            {id: 5, label: 'MTC02', shape: 'box', color: {background: '#45a049', border: '#2e7d32'}, font: {color: 'white'}}
        ]);

        var edges = new vis.DataSet([
            {from: 1, to: 2, color: {color: '#ff9800'}},
            {from: 2, to: 3, color: {color: '#2196F3'}},
            {from: 3, to: 4, color: {color: '#9C27B0'}},
            {from: 4, to: 5, color: {color: '#45a049'}}
        ]);
        var container = document.getElementById('network');
        var data = { nodes: nodes, edges: edges };
        var options = {
            nodes: {
                shape: 'box',
                borderRadius: 5,
                margin: 10,
                color: {
                    background: '#45a049',
                    border: '#45a049',
                    highlight: {
                        background: '#45a049',
                        border: '#45a049'
                    }
                },
                font: {
                    color: 'white'
                }
            },
            edges: {
                color: {
                    color: '#45a049',
                    highlight: '#368038'  
                }
            }
        };

        var network = new vis.Network(container, data, options);
    </script>
</body>
</html>
